<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LandConnect</title>
    <link rel="manifest" href="/web/manifest.webmanifest" />
    <meta name="theme-color" content="#0B3D2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LandConnect" />
    <link rel="apple-touch-icon" href="/web/icon-192.png" />
    <link rel="icon" href="/web/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        background: #d9d4cc;
        color: #111b21;
      }
      /* Phone-like column so the browser looks the same as the mobile app */
      #shell {
        max-width: 480px;
        height: 100vh;
        margin: 0 auto;
        background: #f5f2ea;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 24px #0003;
        position: relative;
      }
      #hdr {
        background: #0b3d2e;
        color: #fff;
        padding: 0 12px;
        height: 52px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }
      #hdr .ttl {
        flex: 1;
        font-weight: 600;
        font-size: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hdr .who {
        font-size: 12px;
        opacity: 0.85;
        text-align: right;
        line-height: 1.2;
      }
      #hdr .hb {
        background: none;
        border: 0;
        color: #fff;
        font-size: 22px;
        cursor: pointer;
        padding: 4px 6px;
        width: auto;
        margin: 0;
      }
      #body {
        flex: 1;
        overflow: auto;
        position: relative;
        background: #f5f2ea;
      }
      #body.white {
        background: #fff;
      }
      #tabs {
        flex: none;
        display: flex;
        background: #fff;
        border-top: 1px solid #ddd;
      }
      #tabs button {
        flex: 1;
        background: none;
        border: 0;
        padding: 7px 2px 6px;
        font-size: 11px;
        color: #6b7a75;
        cursor: pointer;
        width: auto;
        margin: 0;
        border-radius: 0;
      }
      #tabs button span {
        display: block;
        font-size: 20px;
      }
      #tabs button.on {
        color: #0b3d2e;
        font-weight: 700;
      }
      .pad {
        padding: 16px;
      }
      .muted {
        color: #6b7a75;
        font-size: 13px;
        margin-top: 2px;
      }
      .price {
        color: #0b3d2e;
        font-size: 18px;
        font-weight: 700;
      }
      .ttl2 {
        font-weight: 600;
        font-size: 16px;
      }
      .btn {
        display: block;
        width: 100%;
        background: #0e9f6e;
        color: #fff;
        border: 0;
        border-radius: 24px;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin: 12px 0 0;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn.dark {
        background: #0b3d2e;
      }
      .btn.danger {
        background: #e53935;
      }
      .btn.gray {
        background: #6b7a75;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row > .btn {
        flex: 1;
        padding: 12px 4px;
      }
      .in {
        display: block;
        width: 100%;
        padding: 10px;
        margin: 0 0 12px;
        font-size: 15px;
        border: 0;
        border-bottom: 1px solid #ccc;
        background: #fff;
        font-family: inherit;
      }
      textarea.in {
        height: 90px;
        resize: vertical;
      }
      #authbox {
        flex: 1;
        display: none;
        flex-direction: column;
        justify-content: center;
        padding: 24px;
        background: #0b3d2e;
      }
      #authbox h1 {
        color: #fff;
        text-align: center;
        margin: 0 0 20px;
        font-size: 32px;
      }
      #authbox .card {
        background: #fff;
        border-radius: 14px;
        padding: 18px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 4px 0 10px;
      }
      .chip {
        border: 1px solid #0b3d2e;
        color: #0b3d2e;
        background: #fff;
        border-radius: 16px;
        padding: 6px 14px;
        cursor: pointer;
        font-size: 14px;
        text-transform: capitalize;
        width: auto;
        margin: 0;
      }
      .chip.on {
        background: #0b3d2e;
        color: #fff;
      }
      .lcard {
        background: #fff;
        margin: 10px 10px 0;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
      }
      .lcard .cover {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
        background: #ccc;
      }
      .lcard .inf {
        padding: 12px;
      }
      .badge {
        position: absolute;
        right: 10px;
        bottom: 10px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        border-radius: 12px;
        padding: 3px 9px;
        font-size: 12px;
      }
      .rel {
        position: relative;
      }
      .searchrow {
        display: flex;
        gap: 8px;
        padding: 8px;
        background: #fff;
        align-items: center;
      }
      .searchrow .in {
        margin: 0;
        flex: 1;
      }
      .searchrow button {
        width: auto;
        margin: 0;
        background: #0e9f6e;
        color: #fff;
        border: 0;
        border-radius: 18px;
        padding: 10px 16px;
        cursor: pointer;
      }
      .gallery {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
      }
      .gallery img {
        flex: none;
        width: 100%;
        height: 240px;
        object-fit: cover;
        scroll-snap-align: start;
      }
      .map {
        height: 210px;
        border-radius: 10px;
        margin: 8px 0;
        background: #e8e8e8;
        z-index: 0;
      }
      #fmap {
        height: 230px;
      }
      #bigmap {
        height: calc(100vh - 52px - 56px - 36px - 62px);
        min-height: 300px;
        border-radius: 0;
        margin: 0;
      }
      .thumbs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .thumb {
        position: relative;
        flex: none;
        width: 110px;
        height: 110px;
      }
      .thumb img {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 10px;
      }
      .thumb .x {
        position: absolute;
        top: 5px;
        right: 5px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        width: 22px;
        height: 22px;
        border-radius: 11px;
        text-align: center;
        line-height: 22px;
        font-size: 12px;
        cursor: pointer;
      }
      .thumb .cv {
        position: absolute;
        left: 5px;
        bottom: 5px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border-radius: 6px;
        padding: 1px 5px;
        font-size: 10px;
      }
      .addph {
        flex: none;
        width: 110px;
        height: 110px;
        border-radius: 10px;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        font-size: 14px;
      }
      .switchrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .switchrow input {
        width: 22px;
        height: 22px;
      }
      .crow2 {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        background: #fff;
        border-bottom: 1px solid #ddd;
        cursor: pointer;
      }
      .av {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #0e9f6e;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex: none;
      }
      .av.big {
        width: 84px;
        height: 84px;
        font-size: 36px;
        margin: 0 auto;
      }
      .chatwrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      #msgs {
        flex: 1;
        overflow: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
      }
      .b {
        max-width: 80%;
        padding: 8px 10px;
        border-radius: 8px;
        margin: 3px 0;
        background: #fff;
        align-self: flex-start;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .me {
        align-self: flex-end;
        background: #d6f0e0;
      }
      #send {
        display: flex;
        gap: 6px;
        padding: 6px;
        flex: none;
      }
      #send input {
        flex: 1;
        border: 0;
        border-radius: 22px;
        padding: 0 16px;
        height: 44px;
        font-size: 15px;
      }
      #send button {
        background: #25d366;
        color: #fff;
        border: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
        margin: 0;
      }
      .menu {
        position: absolute;
        right: 8px;
        top: 50px;
        background: #fff;
        color: #111;
        border-radius: 8px;
        box-shadow: 0 4px 16px #0004;
        z-index: 20;
        min-width: 190px;
        overflow: hidden;
      }
      .menu div {
        padding: 12px 16px;
        cursor: pointer;
      }
      .menu div:hover {
        background: #f0f2f5;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        cursor: pointer;
      }
      .opt input {
        width: 18px;
        height: 18px;
        margin: 0;
      }
      .sp {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
      }
      .link {
        color: #0e9f6e;
        font-weight: 600;
        cursor: pointer;
        background: none;
        border: 0;
        width: auto;
        margin: 0;
        padding: 0;
      }
      .center {
        text-align: center;
      }

      #call {
        display: none;
        position: fixed;
        inset: 0;
        background: #0b141a;
        color: #fff;
        z-index: 5;
        text-align: center;
      }
      #remote {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #0b141a;
      }
      #local {
        display: none;
        position: absolute;
        top: 16px;
        right: 16px;
        width: 180px;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 12px;
        background: #1f2c34;
        z-index: 2;
        box-shadow: 0 2px 10px #0008;
      }
      #localoff {
        display: none;
        position: absolute;
        top: 16px;
        right: 16px;
        width: 180px;
        aspect-ratio: 4/3;
        border-radius: 12px;
        background: #1f2c34;
        color: #9aa5ab;
        align-items: center;
        justify-content: center;
        z-index: 2;
        box-shadow: 0 2px 10px #0008;
      }
      #localoff svg {
        width: 30px;
        height: 30px;
      }
      #top {
        position: absolute;
        top: 36%;
        width: 100%;
        z-index: 2;
        text-shadow: 0 1px 4px #000;
      }
      #call.vid #top {
        top: 16px;
        left: 16px;
        width: auto;
        text-align: left;
      }
      .nm {
        font-size: 30px;
        font-weight: 600;
      }
      #call.vid .nm {
        font-size: 20px;
      }
      .sb {
        color: #ddd;
        font-size: 16px;
        margin-top: 8px;
      }
      #cnote {
        color: #ffcc80;
        font-size: 13px;
        margin: 6px auto 0;
        max-width: 420px;
      }
      #call.vid #cnote {
        margin-left: 0;
      }
      #cbar {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        background: rgba(32, 44, 51, 0.92);
        padding: 10px 16px;
        border-radius: 40px;
        z-index: 3;
      }
      .cb {
        width: 56px;
        height: 56px;
        margin: 0;
        padding: 0;
        border-radius: 50%;
        background: #2a3942;
        color: #fff;
        border: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cb:hover {
        filter: brightness(1.2);
      }
      .cb.on {
        background: #fff;
        color: #111;
      }
      .cb.red {
        background: #e53935;
        color: #fff;
        width: 76px;
        border-radius: 28px;
      }
      .cb.grn {
        background: #25d366;
        color: #fff;
      }
      .cb.big {
        width: 68px;
        height: 68px;
        border-radius: 50%;
      }
      #inc {
        display: none;
        position: fixed;
        inset: 0;
        background: #0b141a;
        color: #fff;
        z-index: 6;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .crow {
        display: flex;
        gap: 56px;
        margin-top: 60px;
      }
      .cw {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 13px;
        color: #ddd;
      }
      .cw span {
        margin-top: 8px;
      }

      /* ---- LandConnect theme v2 (same look as the mobile app) ---- */
      body {
        background: #e7e2d5;
      }
      #hdr {
        height: auto;
        min-height: 66px;
        padding: 14px 18px 18px;
        border-radius: 0 0 28px 28px;
      }
      #hdr .ttl {
        font-size: 23px;
        font-weight: 800;
      }
      #body.white {
        background: #f5f2ea;
      }
      #tabs {
        border-top: 0;
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -4px 18px #0b3d2e1f;
        padding: 6px 4px 4px;
      }
      #tabs button {
        font-weight: 700;
        color: #8e9a95;
      }
      #tabs button.on {
        color: #0e9f6e;
      }
      #tabs button span {
        display: block;
        font-size: 20px;
      }
      .btn {
        border-radius: 16px;
        padding: 14px;
        font-weight: 800;
        box-shadow: 0 6px 14px #0b3d2e1a;
      }
      .btn.dark {
        background: #0b3d2e;
      }
      .in {
        border: 1px solid #e6e1d6;
        border-radius: 14px;
        padding: 13px 14px;
      }
      .price {
        color: #0e9f6e;
      }
      .lcard {
        border-radius: 22px;
        margin: 10px 12px 0;
        box-shadow: 0 6px 16px #0b3d2e1a;
      }
      .crow2 {
        border: 0;
        border-radius: 20px;
        margin: 10px 14px 0;
        box-shadow: 0 6px 16px #0b3d2e1a;
      }
      .av {
        font-weight: 700;
      }
      .chip {
        border: 1.5px solid #0e9f6e;
        color: #0e9f6e;
        border-radius: 20px;
        padding: 8px 16px;
      }
      .chip.on {
        background: #0e9f6e;
        color: #fff;
      }
      .b {
        border-radius: 18px;
        padding: 9px 13px;
      }
      .me {
        background: #d6f0e0;
        border-bottom-right-radius: 5px;
      }
      #authbox h1 {
        font-weight: 800;
      }
      #authbox .card {
        border-radius: 26px;
        padding: 22px;
      }
      .acts {
        display: flex;
        gap: 8px;
      }
      .acts button {
        width: 40px;
        height: 40px;
        margin: 0;
        padding: 0;
        border-radius: 50%;
        border: 0;
        background: #e8f3ec;
        font-size: 17px;
        cursor: pointer;
      }
      .pill {
        display: inline-block;
        background: #e8f3ec;
        color: #0e9f6e;
        border-radius: 10px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 700;
        text-transform: capitalize;
      }

      /* ---- v3: profile photos, WhatsApp-style chat, attractive first page ---- */
      .av {
        background: #c5ced2;
        overflow: hidden;
        position: relative;
      }
      .av svg {
        width: 60%;
        height: 60%;
        fill: #fff;
        display: block;
      }
      .av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .av.sm {
        width: 20px;
        height: 20px;
        display: inline-flex;
        vertical-align: middle;
        margin-right: 6px;
      }
      .av.hdr {
        width: 36px;
        height: 36px;
        display: inline-flex;
        vertical-align: middle;
        margin-right: 10px;
      }
      .av.huge {
        width: 120px;
        height: 120px;
        margin: 0 auto 18px;
      }
      #hdr .who {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #hdr .who .av.hdr {
        margin-right: 0;
      }
      .ownerrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0;
      }
      #cav {
        display: flex;
        justify-content: center;
      }
      #call.vid #cav {
        display: none;
      }
      #incav {
        display: flex;
        justify-content: center;
      }
      .b {
        white-space: normal;
        display: block;
      }
      .b > span:first-child {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .b .meta {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: #8a9a94;
        margin-top: 2px;
        white-space: nowrap;
      }
      .b .meta svg {
        width: 16px;
        height: 16px;
        fill: #8a9a94;
      }
      .b .meta svg.rd {
        fill: #34b7f1;
      }
      .dchip {
        align-self: center;
        background: #e4e0d3;
        color: #6b7a75;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 10px;
        margin: 10px 0;
      }
      .pcam {
        position: absolute;
        right: -4px;
        bottom: -4px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #0e9f6e;
        border: 2px solid #fff;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
      }
      .pcard {
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 6px 16px #0b3d2e1a;
        padding: 16px;
        margin-top: 18px;
      }
      #authbox {
        justify-content: flex-start;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
        background: #0b3d2e url(auth-bg.jpg) center top / cover no-repeat;
      }
      #authbox > * {
        position: relative;
        z-index: 1;
      }
      #authbox > .aback {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .aback .orb {
        position: absolute;
        border-radius: 50%;
      }
      .aback .o1 {
        width: 340px;
        height: 340px;
        top: 120px;
        left: -90px;
        background: #f59e0b1a;
        animation: drift 6s ease-in-out infinite alternate;
        --dx: 30px;
        --dy: 20px;
      }
      .aback .o2 {
        width: 300px;
        height: 300px;
        top: 360px;
        right: -120px;
        background: #0e9f6e29;
        animation: drift 7.5s ease-in-out infinite alternate;
        --dx: 26px;
        --dy: 34px;
      }
      @keyframes drift {
        from {
          transform: translate(calc(var(--dx) * -1), calc(var(--dy) * -1));
        }
        to {
          transform: translate(var(--dx), var(--dy));
        }
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #ffe2a0;
        animation: twinkle 2s ease-in-out infinite alternate;
      }
      @keyframes twinkle {
        from {
          opacity: 0.15;
        }
        to {
          opacity: 1;
        }
      }
      .ahero {
        text-align: center;
        padding: 28px 24px 0;
        color: #fff;
      }
      .alogo {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: #0e9f6e;
        border: 3px solid #ffffffd9;
        box-shadow: 0 8px 22px #0006;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        animation:
          logoin 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) both,
          logobob 3.2s ease-in-out 0.9s infinite alternate;
      }
      .alogo svg {
        width: 38px;
        height: 38px;
        fill: #fff;
      }
      @keyframes logoin {
        from {
          transform: scale(0) rotate(-90deg);
        }
        to {

    <script>
      const $ = (id) => document.getElementById(id);
      const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
      let callName = "",
        token = "",
        me = null,
        ws = null,
        peer = 0,
        pc = null,
        stream = null,
        pending = [],
        busy = false,
        incoming = null,
        callPeer = 0;
      async function api(path, method = "GET", body) {
        const r = await fetch(path, {
          method,
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || "Request failed");
        return d;
      }
      function connect() {
        ws = new WebSocket(
          (location.protocol === "https:" ? "wss://" : "ws://") +
            location.host +
            "/ws?token=" +
            token,
        );
        ws.onmessage = (e) => onMsg(JSON.parse(e.data));
        ws.onclose = () => setTimeout(() => token && connect(), 2000);
      }
      const send = (m) =>
        ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
      let speakerOn = true,
        muted = false,
        camOff = false,
        secs = 0,
        timer = null,
        connected = false;
      const fmt = (n) =>
        String(Math.floor(n / 60)).padStart(2, "0") +
        ":" +
        String(n % 60).padStart(2, "0");
      function mediaErr(e) {
        const m = {
          NotAllowedError:
            "permission blocked - click the lock icon in the address bar and Allow",
          NotFoundError: "no camera/microphone found",
          NotReadableError:
            "camera is busy or not responding (close Teams/Zoom/Camera app, or restart laptop)",
        };
        return e ? m[e.name] || e.message || String(e) : "unknown error";
      }
      function setStatus(s) {
        $("cstatus").textContent = s;
      }
      function note(s) {
        $("cnote").textContent = s || "";
      }
      function tick() {
        if (connected) setStatus("Connected \u00b7 " + fmt(secs));
      }
      const IC = {
        spk: "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z",
        mic: "M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z",
        micoff:
          "M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z",
        cam: "M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z",
        camoff:
          "M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z",
        end: "M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z",
        call: "M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z",
      };
      const svg = (d) =>
        '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="' +
        d +
        '"/></svg>';
      function ctlState() {
        const set = (id, on, d) => {
          $(id).className = "cb" + (on ? " on" : "");
          $(id).innerHTML = svg(d);
        };
        set("bspk", speakerOn, IC.spk);
        set("bmute", muted, muted ? IC.micoff : IC.mic);
        set("bcam", camOff, camOff ? IC.camoff : IC.cam);
      }
      $("bend").innerHTML = svg(IC.end);
      $("bdec").innerHTML = svg(IC.end);
      $("bacc").innerHTML = svg(IC.call);
      $("localoff").innerHTML = svg(IC.camoff);
      ctlState();
      let remoteHasVideo = false,
        remoteCamOff = false;
      function updView() {
        const show = remoteHasVideo && !remoteCamOff;
        $("remote").style.display = show ? "block" : "none";
        $("call").classList.toggle("vid", show);
      }
      async function getMedia(video) {
        if (!video)
          return {
            s: await navigator.mediaDevices.getUserMedia({ audio: true }),
            video: false,
          };
        let err;
        for (const v of [
          {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30, max: 30 },
          },
          true,
        ]) {
          try {
            return {
              s: await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: v,
              }),
              video: true,
            };
          } catch (e) {
            err = e;
            if (e.name === "NotAllowedError") break;
          }
        }
        try {
          const ds = (await navigator.mediaDevices.enumerateDevices()).filter(
            (d) => d.kind === "videoinput" && d.deviceId,
          );
          if (ds.length > 1)
            for (const d of ds) {
              try {
                return {
                  s: await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: { deviceId: { exact: d.deviceId } },
                  }),
                  video: true,
                };
              } catch (e) {
                err = e;
              }
            }
        } catch (e) {}
        return {
          s: await navigator.mediaDevices.getUserMedia({ audio: true }),
          video: false,
          err,
        };
      }
      async function testCam() {
        $("camres").textContent = "Testing\u2026";
        try {
          const g = await getMedia(true);
          g.s.getTracks().forEach((t) => t.stop());
          $("camres").textContent = g.video
            ? "Camera works \u2713"
            : "Camera failed: " + mediaErr(g.err);
        } catch (e) {
          $("camres").textContent = "Failed: " + mediaErr(e);
        }
      }
      // Raise the outgoing video bitrate cap (WebRTC starts low, which looks blurry).
      async function boostVideo(c) {
        for (const s of c.getSenders()) {
          if (!s.track || s.track.kind !== "video") continue;
          try {
            const p = s.getParameters();
            if (!p.encodings || !p.encodings.length) p.encodings = [{}];
            p.encodings[0].maxBitrate = 2500000;
            p.encodings[0].maxFramerate = 30;
            p.degradationPreference = "maintain-resolution";
            await s.setParameters(p);
          } catch (e) {}
        }
      }
      async function prepare(p, video, isCaller) {
        let cfg = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        try {
          cfg = await api("/ice");
        } catch (e) {}
        const g = await getMedia(video);
        stream = g.s;
        callPeer = p;
        const hv = g.video;
        $("local").srcObject = stream;
        $("local").style.display = hv ? "block" : "none";
        $("bcam").style.display = hv ? "flex" : "none";
        note(
          video && !hv
            ? "Camera unavailable (" +
                mediaErr(g.err) +
                "). You can still see the other person\u2019s video."
            : "",
        );
        const c = new RTCPeerConnection(cfg);
        pc = c;
        stream.getTracks().forEach((t) => c.addTrack(t, stream));
        if (isCaller && video && !hv)
          c.addTransceiver("video", { direction: "recvonly" });
        c.onicecandidate = (e) =>
          e.candidate &&
          send({ type: "ice", to: p, candidate: e.candidate.toJSON() });
        c.ontrack = (e) => {
          const r = $("remote");
          r.srcObject = e.streams[0];
          r.muted = !speakerOn;
          r.play().catch(() => {});
          if (e.track.kind === "video") {
            remoteHasVideo = true;
            updView();
          }
        };
        c.oniceconnectionstatechange = () => {
          const s = c.iceConnectionState;
          if (s === "connected" || s === "completed") {
            connected = true;
            boostVideo(c);
            if (!timer) {
              secs = 0;
              timer = setInterval(() => {
                secs++;
                tick();
              }, 1000);
            }
            tick();
          } else if (s === "checking") setStatus("Connecting\u2026");
          else if (s === "disconnected") {
            connected = false;
            setStatus("Reconnecting\u2026");
          } else if (s === "failed") {
            connected = false;
            setStatus(
              "FAILED: network blocks direct media - TURN server needed",
            );
            setTimeout(() => {
              if (pc === c) endCall();
            }, 3000);
          }
        };
        speakerOn = true;
        muted = false;
        camOff = false;
        ctlState();
        $("call").style.display = "block";
        return hv;
      }
      async function startCall(video) {
        if (!peer || busy) return;
        busy = true;
        callName = $("peerName").textContent.replace(/ \(.*\)$/, "");
        try {
          $("cname").textContent = callName;
          $("cav").innerHTML = avHtml(userCache[peer], "huge");
          // fetch their latest name + photo for the call screen
          const pp = peer;
          api("/users/" + pp)
            .then((u) => {
              remember(u);
              if (callPeer === pp || peer === pp) {
                $("cname").textContent = u.name;
                $("cav").innerHTML = avHtml(u, "huge");
              }
            })
            .catch(() => {});
          $("call").style.display = "block";
          setStatus("Calling\u2026");
          await prepare(peer, video, true);
          const o = await pc.createOffer();
          await pc.setLocalDescription(o);
          send({
            type: "offer",
            to: peer,
            sdp: { type: o.type, sdp: o.sdp },
            video,
          });
        } catch (e) {
          alert("Call failed: " + mediaErr(e));
          cleanup();
        }
      }
      async function acceptCall() {
        const inc = incoming;
        if (!inc) return;
        $("inc").style.display = "none";
        incoming = null;
        callName = inc.name;
        try {
          $("cname").textContent = callName;
          $("cav").innerHTML = avHtml({ avatar_url: inc.avatar_url }, "huge");
          await prepare(inc.from, inc.video, false);
          setStatus("Connecting\u2026");
          await pc.setRemoteDescription(inc.sdp);
          for (const c of pending) await pc.addIceCandidate(c);
          pending = [];
          const a = await pc.createAnswer();
          await pc.setLocalDescription(a);
          send({
            type: "answer",
            to: inc.from,
            sdp: { type: a.type, sdp: a.sdp },
          });
        } catch (e) {
          alert("Accept failed: " + mediaErr(e));
          send({ type: "end", to: inc.from });
          cleanup();
        }
      }
      function rejectCall() {
        if (incoming) send({ type: "reject", to: incoming.from });
        cleanup();
      }
      function endCall() {
        if (callPeer || incoming)
          send({ type: "end", to: callPeer || incoming.from });
        cleanup();
      }
      function toggleSpeaker() {
        speakerOn = !speakerOn;
        $("remote").muted = !speakerOn;
        ctlState();
      }
      function toggleMute() {
        if (!stream) return;
        muted = !muted;
        stream.getAudioTracks().forEach((t) => (t.enabled = !muted));
        ctlState();
      }
      function toggleCam() {
        if (!stream) return;
        camOff = !camOff;
        stream.getVideoTracks().forEach((t) => (t.enabled = !camOff));
        send({ type: "cam", to: callPeer, on: !camOff });
        $("local").style.opacity = camOff ? 0 : 1;
        $("localoff").style.display = camOff ? "flex" : "none";
        ctlState();
      }
      function cleanup() {
        if (stream) stream.getTracks().forEach((t) => t.stop());
        if (pc) {
          try {
            pc.close();
          } catch (e) {}
        }
        clearInterval(timer);
        timer = null;
        connected = false;
        secs = 0;
        pc = null;
        stream = null;
        pending = [];
        busy = false;
        incoming = null;
        callPeer = 0;
        $("call").style.display = "none";
        $("call").classList.remove("vid");
        $("inc").style.display = "none";
        $("remote").srcObject = null;
        $("remote").style.display = "none";
        remoteHasVideo = false;
        remoteCamOff = false;
        $("local").style.opacity = 1;
        $("localoff").style.display = "none";
        note("");
      }
      // Why a call / chat message was refused by the server (privacy + role rules are enforced on the backend)
      const CALL_DENIED = {
        offline: [
          "User is offline",
          "The other person must have LandConnect open.",
        ],
        busy: [
          "User is busy",
          "They are on another call. Try again in a moment.",
        ],
        blocked: ["Call not possible", "You can't call this user."],
        not_allowed: [
          "Call not allowed",
          "This user isn't accepting calls from you.",
        ],
      };
      const CHAT_DENIED = {
        blocked: "You can't message this user.",
        not_allowed: "Buyers can only chat with sellers and brokers.",
      };
      async function onMsg(m) {
        try {
          if (m.type === "chat") {
            onChatMsg(m);
          } else if (m.type === "status" && Array.isArray(m.ids)) {
            chatMsgs.forEach((x) => {
              if (
                m.ids.includes(x.id) &&
                (RANK[m.status] || 0) > (RANK[x.status] || 0)
              )
                x.status = m.status;
            });
            renderMsgs();
          } else if (m.type === "chat_denied") {
            if (m.to === peer)
              alert(
                "Message not sent\n" + (CHAT_DENIED[m.reason] || "Not allowed"),
              );
          } else if (m.type === "offer") {
            if (busy) return send({ type: "reject", to: m.from });
            busy = true;
            pending = [];
            incoming = m;
            $("incname").textContent = m.name;
            $("incav").innerHTML = avHtml({ avatar_url: m.avatar_url }, "huge");
            $("inctype").textContent =
              "Incoming " + (m.video ? "video" : "audio") + " call…";
            $("inc").style.display = "flex";
          } else if (m.type === "answer" && pc) {
            await pc.setRemoteDescription(m.sdp);
            for (const c of pending) await pc.addIceCandidate(c);
            pending = [];
          } else if (m.type === "ice") {
            if (pc && pc.remoteDescription)
              await pc.addIceCandidate(m.candidate).catch(() => {});
            else pending.push(m.candidate);
          } else if (m.type === "cam") {
            if (m.from === callPeer) {
              remoteCamOff = !m.on;
              updView();
            }
          } else if (m.type === "reject" || m.type === "end") {
            const why = CALL_DENIED[m.reason];
            if (why) alert(why[0] + "\n" + why[1]);
            cleanup();
          }
        } catch (e) {
          console.error(e);
        }
      }
      /* =====================================================================
         LandConnect web app (same screens and role rules as the mobile app)
         Tabs: Community · Chats · Meetings · My listings (seller/broker) · Profile
         ===================================================================== */
      const esc = (s) =>
        String(s == null ? "" : s).replace(

              '"': "&quot;",

        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const p2 = (n) => String(n).padStart(2, "0");
      const fmtDate = (iso) => {
        const d = new Date(iso);
        return (
          p2(d.getDate()) +
          " " +
          MON[d.getMonth()] +
          " " +
          d.getFullYear() +
          ", " +
          p2(d.getHours()) +
          ":" +
          p2(d.getMinutes())

      /* ---------- profile photo (default person icon when none) ---------- */

      /* ---------- chat time helpers: always Indian Standard Time (UTC+5:30) ---------- */
      const IST_MS = 5.5 * 3600e3;
      const toIst = (iso) =>
        new Date(
          new Date(
            /[zZ]|[+-]\d\d:?\d\d$/.test(iso)
              ? iso
              : iso.replace(" ", "T") + "Z",
          ).getTime() + IST_MS,
        );
      const istKey = (d) =>
        d.getUTCFullYear() +
        "-" +
        p2(d.getUTCMonth() + 1) +
        "-" +
        p2(d.getUTCDate());
      const fmtClock = (iso) => {
        const d = toIst(iso),
          h = d.getUTCHours();
        return (
          (h % 12 || 12) +
          ":" +
          p2(d.getUTCMinutes()) +
          (h < 12 ? " AM" : " PM")
        );
      };
      const dayLabel = (iso) => {
        const d = toIst(iso),
          k = istKey(d);
        if (k === istKey(new Date(Date.now() + IST_MS))) return "Today";
        if (k === istKey(new Date(Date.now() + IST_MS - 864e5)))
          return "Yesterday";
        return (
          p2(d.getUTCDate()) +
          " " +
          MON[d.getUTCMonth()] +
          " " +
          d.getUTCFullYear()
        );
      };
      const TICK1 = "M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z";
      const TICK2 =

      const tickHtml = (st) =>
        '<svg viewBox="0 0 24 24" class="' +
        (st === "read" ? "rd" : "") +

        (st === "read" || st === "delivered" ? TICK2 : TICK1) +

      const RANK = { sent: 1, delivered: 2, read: 3 };

      let tab = "community",

      /* ---------- maps (Leaflet + OpenStreetMap, no API key) ---------- */
      const hasMap = () => typeof L !== "undefined";
      function mapCleanup() {
        if (mapObj) {

      function mkMap(id, lat, lng, zoom) {
        const el = $(id);

            '<div class="pad muted center">Map could not load (internet needed). Location: ' +
            Number(lat).toFixed(4) +
            ", " +
            Number(lng).toFixed(4) +
            "</div>";
          return null;
        }
        mapCleanup();
        mapObj = L.map(el).setView([lat, lng], zoom);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap",
        }).addTo(mapObj);
        return mapObj;
      }
      async function placeName(lat, lng) {
        try {
          const r = await fetch(
            "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&accept-language=en&lat=" +
              lat +
              "&lon=" +
              lng,
          );
          const a = (await r.json()).address || {};
          const parts = [
            a.village || a.hamlet || a.suburb || a.town || a.city,
            a.state_district || a.county,
            a.state,
          ].filter(Boolean);
          return Array.from(new Set(parts)).join(", ");

          return "";

        drawThumbs();

      // crop to a centred square (max 512px) before uploading
      function cropSquare(file) {
        return new Promise((resolve) => {
          const im = new Image(),
            url = URL.createObjectURL(file);
          im.onload = () => {
            const side = Math.min(im.width, im.height),
              out = Math.min(512, side),
              c = document.createElement("canvas");
            c.width = c.height = out;
            c.getContext("2d").drawImage(
              im,
              (im.width - side) / 2,
              (im.height - side) / 2,
              side,
              side,
              0,
              0,
              out,
              out,
            );
            URL.revokeObjectURL(url);
            c.toBlob((b) => resolve(b || file), "image/jpeg", 0.85);
          };
          im.onerror = () => resolve(file);
          im.src = url;
        });
      }

                    '</span><button class="link" onclick="unblock(' +
                    b.id +
                    ')">Unblock</button></div>',
                )
                .join("")
            : "You haven’t blocked anyone. Block someone from a chat (⋮ menu).";
        } catch (e) {}
      }
      async function unblock(id) {
        try {
          await api("/blocks/" + id, "DELETE");
          loadBlocked();
        } catch (e) {
          alert(e.message);
        }
      }
      function logout() {
        token = "";
        try {
          sessionStorage.removeItem("lc");
          ws && ws.close();
        } catch (e) {}
        location.reload();
      }

      const VIEWS = {
        community: () => listingsView(false),
        mylistings: () => listingsView(true),
        chats: chatsView,
        buyers: buyersView,
        meetings: meetingsView,
        profile: profileView,
        detail: detailView,
        form: formView,
        chat: chatView,
        newMeeting: newMeetingView,
        meeting: meetingView,
      };

      /* ---------- login / register ---------- */
      /* ---------- animated 3D "land value map" for the first page (same design as the mobile app) ---------- */
      function buildScene() {
        const N = 5,
          W = 64,
          HH = 32,
          A = W / Math.SQRT2,
          OX = 160,
          OY = 92;
        const HE = [
          [10, 14, 8, 18, 12],
          [16, 26, 12, 10, 20],
          [8, 12, 44, 16, 10],
          [14, 20, 12, 28, 8],
          [10, 8, 18, 12, 16],
        ];
        const PAL = [
          "#34B36B",
          "#2F9E5F",
          "#7CBF4A",
          "#C9B44A",
          "#1F8A52",
          "#9BC653",
          "#D1A843",
        ];
        const shade = (hex, f) => {
          const n = parseInt(hex.slice(1), 16);
          return (
            "#" +
            [(n >> 16) & 255, (n >> 8) & 255, n & 255]
              .map((v) =>
                Math.round(v * f)
                  .toString(16)
                  .padStart(2, "0"),
              )
              .join("")
          );
        };
        const tiles = [];
        for (let i = 0; i < N; i++)
          for (let j = 0; j < N; j++) {
            const H = HE[i][j],
              pin = i === 2 && j === 2,
              top = pin ? "#F59E0B" : PAL[(i * 3 + j * 5) % PAL.length];
            tiles.push({
              i,
              j,
              H,
              pin,
              top,
              l: shade(top, 0.74),
              r: shade(top, 0.55),
              cx: OX + ((i - j) * W) / 2,
              cy: OY + ((i + j) * HH) / 2 - H,
              d: i + j,
            });
          }
        tiles.sort((a, b) => a.d - b.d || a.i - b.i);
        let h = "";
        tiles.forEach((t) => {
          h +=
            '<div class="tg' +
            (t.pin ? " pt" : "") +
            '" style="left:' +
            (t.cx - W / 2) +
            "px;top:" +
            (t.cy - HH / 2) +
            "px;width:" +
            W +
            "px;height:" +
            (HH + t.H) +
            "px;animation-delay:" +
            (0.5 + t.d * 0.11) +
            's">' +
            '<div class="tf" style="animation-delay:' +
            (1.8 + t.d * 0.15) +
            's">' +
            '<i style="left:0;top:' +
            (HH / 2 + W / 8) +
            "px;width:" +
            (W / 2 + 0.5) +
            "px;height:" +
            t.H +
            "px;background:" +
            t.l +
            ';transform:skewY(26.565deg)"></i>' +
            '<i style="left:' +
            (W / 2 - 0.5) +
            "px;top:" +
            (HH / 2 + W / 8) +
            "px;width:" +
            (W / 2 + 0.5) +
            "px;height:" +
            t.H +
            "px;background:" +
            t.r +
            ';transform:skewY(-26.565deg)"></i>' +
            '<i style="left:' +
            (W / 2 - A / 2) +
            "px;top:" +
            (HH / 2 - A / 2) +
            "px;width:" +
            A +
            "px;height:" +
            A +
            "px;box-sizing:border-box;background:" +
            t.top +
            ';border:1px solid #ffffff59;transform:scaleY(.5) rotate(45deg)"></i>' +
            "</div></div>";
        });
        const tip = tiles.find((t) => t.pin);
        const rip = (d) =>
          '<div class="rp" style="left:' +
          (tip.cx - A / 2) +
          "px;top:" +
          (tip.cy - A / 2) +
          "px;width:" +
          A +
          "px;height:" +
          A +
          "px;box-sizing:border-box;animation-delay:" +
          d +
          's"></div>';
        h += rip("2.6s") + rip("3.7s");
        h +=
          '<div class="pinshadow" style="left:' +
          (tip.cx - 14) +
          "px;top:" +
          (tip.cy - 5) +
          'px"></div>';
        h +=
          '<div class="pinw" style="left:' +
          (tip.cx - 22) +
          "px;top:" +
          (tip.cy - 53) +
          'px"><div class="pinb"></div></div>';
        const tag = (txt, ic, pos, d, fd) =>
          '<div class="stag" style="' +
          pos +
          ";animation-delay:" +
          d +
          's"><span>' +
          ic +
          '</span><b style="animation-delay:' +
          fd +
          '">' +
          txt +
          "</b></div>";
        h += tag("₹38 L · 2 acre", "🏷️", "left:2px;top:22px", "2.6s", "2.6s");
        h += tag("Live video call", "🎥", "right:0;top:70px", "2.9s", "2.9s");
        h += tag(
          "Site visit 4:30 PM",
          "📅",
          "left:14px;bottom:14px",
          "3.2s",
          "3.2s",
        );
        $("sc").innerHTML = h;
        // twinkling stars
        let sh = "";
        for (let n = 0; n < 26; n++)
          sh +=
            '<i class="star" style="left:' +
            ((n * 37) % 100) +
            "%;top:" +
            ((n * 53) % 62) +
            "%;width:" +
            (1.5 + (n % 3)) +
            "px;height:" +
            (1.5 + (n % 3)) +
            "px;animation-duration:" +
            (1.2 + (n * 170) / 1000) +
            "s;animation-delay:" +
            n * 0.17 +
            's"></i>';
        $("stars").innerHTML = sh;
        fitScene();
      }
      function fitScene() {
        const w = Math.min(window.innerWidth, 480),
          k = Math.min(1, (w - 24) / 320);
        $("sc").style.setProperty("--k", k);
        $("ascene").style.height = 256 * k + "px";
      }
      window.addEventListener("resize", fitScene);
      let authMode = "login";
      function renderRoleChips() {
        const info = {
          buyer: ["🔍", "Find land"],
          seller: ["🏷️", "Sell land"],
          broker: ["💼", "Manage deals"],
        };
        $("rolechips").innerHTML = ["buyer", "seller", "broker"]
          .map(
            (r) =>
              '<div class="rolecard' +
              (selRole === r ? " on" : "") +
              '" onclick="selRole=\'' +
              r +
              '\';renderRoleChips()"><div style="font-size:20px">' +
              info[r][0] +
              "</div><b>" +
              r[0].toUpperCase() +
              r.slice(1) +
              "</b><small>" +
              info[r][1] +
              "</small></div>",
          )
          .join("");
      }
      function setAuthMode(m) {
        authMode = m;
        $("tlogin").className = m === "login" ? "on" : "";
        $("treg").className = m === "register" ? "on" : "";
        $("name").style.display = m === "register" ? "" : "none";
        $("regrole").style.display = m === "register" ? "" : "none";
        $("abtn").textContent = m === "register" ? "Create account" : "Log in";
        $("err").textContent = "";
      }
      function togglePw() {
        const i = $("pw");
        i.type = i.type === "password" ? "text" : "password";
        $("pwt").textContent = i.type === "password" ? "👁" : "🙈";
      }
      function saveSession() {
        try {
          sessionStorage.setItem("lc", JSON.stringify({ t: token, u: me }));
        } catch (e) {}
      }
      async function doAuth(reg) {
        $("err").textContent = "";
        try {
          const email = $("email").value.trim(),
            password = $("pw").value;
          if (reg) {
            const r = await fetch("/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: $("name").value,
                email,
                password,
                role: selRole,
              }),
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.detail || "Register failed");
          }
          const r = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body:
              "username=" +
              encodeURIComponent(email) +
              "&password=" +
              encodeURIComponent(password),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || "Login failed");
          token = d.access_token;
          me = d.user;
          saveSession();
          startApp();
        } catch (e) {
          $("err").textContent = e.message;
        }
      }
      function startApp() {
        $("authbox").style.display = "none";
        $("hdr").style.display = "";
        $("body").style.display = "";
        connect();
        tab = "community";
        stack = [];
        render();
      }
      (async function init() {
        buildScene();
        renderRoleChips();
        let s = null;
        try {
          s = JSON.parse(sessionStorage.getItem("lc") || "null");
        } catch (e) {}
        if (s && s.t) {
          token = s.t;
          try {
            me = await api("/me");
            saveSession();
            return startApp();
          } catch (e) {
            token = "";
            me = null;
          }
        }
        $("authbox").style.display = "flex";
      })();
    </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});</script>
